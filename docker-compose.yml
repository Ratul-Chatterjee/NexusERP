version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexuserp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexuserp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexuserp-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nexuserp
      JWT_SECRET: nexuserp_local_secret_2026
      CLOUDINARY_CLOUD_NAME: demo_cloud
      CLOUDINARY_API_KEY: demo_key
      CLOUDINARY_API_SECRET: demo_secret
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexuserp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
