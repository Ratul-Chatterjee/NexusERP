name: CI/CD Pipeline - NexusERP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node-清新@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Backend API
        run: |
          cd backend
          npm ci
          npm run build

      - name: Build Frontend React Web App
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-render:
    name: Deploy Backend to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping automated deploy hook."
          fi
